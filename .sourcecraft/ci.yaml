on:
  push:
    - workflows: [build-and-deploy]
      filter:
        branches: ["main"]

workflows:
  build-and-deploy:
    tasks:
      - name: build-job

tasks:
  - name: build-job
    cubes:
      - name: install-mkdocs
        image: python:3.11-slim
        script:
          - pip install mkdocs
          - mkdocs build --site-dir site
          - ls -la site/  # Это покажет, что папка site создалась

      - name: commit-and-push
        script:
          - git config user.email "ci@sourcecraft.dev"
          - git config user.name "CI Bot"
          - git add site/
          - git commit -m "Add built site files" || echo "No changes to commit"
          - git push origin main