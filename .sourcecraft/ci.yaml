on:
  push:
    - workflows: [build-and-deploy]
      filter:
        branches: ["main"]

workflows:
  build-and-deploy:
    tasks:
      - name: build-job

tasks:
  - name: build-job
    cubes:
      - name: install-mkdocs
        image: python:3.11-slim
        script:
          - pip install mkdocs
          - mkdocs build --site-dir site

      # Этот кубик делает коммит собранного сайта в репозиторий
      - name: commit-site
        script:
          - git config user.email "ci@sourcecraft.dev"
          - git config user.name "CI Bot"
          - git add site/
          - git commit -m "Update built site" || echo "No changes to commit"
          - git push origin main