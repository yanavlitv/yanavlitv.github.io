on:
  push:
    - workflows: [build-mkdocs-site]
      filter:
        branches: ["main"]

workflows:
  build-mkdocs-site:
    tasks:
      - name: build-and-deploy

tasks:
  - name: build-and-deploy
    cubes:
      - name: install-mkdocs
        image: python:3.11-slim
        script:
          - pip install mkdocs
          # КЛЮЧЕВОЙ МОМЕНТ: Эта команда создаст папку 'site'
          - mkdocs build --site-dir site